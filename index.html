<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="随机掉落七个独立视觉元素词">
  <title>Machine — Word Machine</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/word-machine-v2.css">
  <link rel="stylesheet" href="./css/wordmark.css">
  <link rel="stylesheet" href="./css/drop-card-alignment.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="./index.html">WORD MACHINE</a>
  <button class="menu-button" aria-expanded="false" aria-label="打开导航">MENU</button>
  <nav class="nav-links" aria-label="主要导航"><a href="./index.html" aria-current="page">MACHINE</a><a href="./word-bank.html">WORD BANK</a><a href="./my-words.html">MY WORDS</a><a href="./saved.html">SAVED</a></nav>
</header>
<main class="drop-main">
  <header class="drop-intro" aria-label="Word Machine logo">
    <div class="hero-wordmark"><strong>WORD MACHINE</strong></div>
  </header>
  <section class="drop-machine" aria-labelledby="drop-title">
    <header class="machine-heading"><div><span class="machine-light" aria-hidden="true"></span><h2 id="drop-title">TODAY'S DROP</h2></div><button class="unlock-all" data-action="unlock">全部解锁</button></header>
    <div class="drop-slots" aria-live="polite"></div>
    <p class="drop-line" aria-label="当前七个词"></p>
    <div class="drop-controls">
      <button class="primary-control" data-action="new">NEW DROP</button>
      <button data-action="manual">手动挑选</button>
      <button data-action="copy">复制词语</button>
      <button data-action="save">保存这组</button>
    </div>
    <p class="machine-note">锁住想保留的词，再按 NEW DROP，只会更换其他词。</p>
  </section>
  <section class="manual-picker" aria-labelledby="picker-title" hidden>
    <header><div><span class="folio">REPLACE ONE</span><h2 id="picker-title">选择一个词</h2></div><button class="picker-close" aria-label="关闭手动挑选">×</button></header>
    <label class="picker-search"><span>⌕</span><input type="search" placeholder="搜索词语……" aria-label="搜索词语"></label>
    <div class="picker-results"></div>
    <a class="picker-bank-link" href="./word-bank.html">进入完整词仓 →</a>
  </section>

  <section class="visual-note" aria-labelledby="visual-note-title">
    <header><h2 id="visual-note-title">VISUAL TRACE</h2><span class="folio">RULE-BASED · GENERATED FROM TODAY'S DROP</span></header>
    <div class="doodle-paper" aria-live="polite"></div>
  </section>
</main>
<footer class="site-footer">WORD MACHINE · seven loose elements · <span class="year"></span></footer>
<div class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./js/machine.js"></script>
</body>
</html>
